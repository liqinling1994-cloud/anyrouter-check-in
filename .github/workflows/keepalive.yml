name: Keep Alive

on:
  schedule:
    # 每 5 天运行一次（北京时间 10:17）
    - cron: '17 2 */5 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 更新时间戳并提交
        run: |
          mkdir -p .keepalive
          echo "Last keep-alive: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > .keepalive/timestamp.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive/timestamp.txt
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: keep-alive $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: 重新启用所有 workflow（防止被禁用）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable checkin.yml --repo ${{ github.repository }} || true
          gh workflow enable keepalive.yml --repo ${{ github.repository }} || true
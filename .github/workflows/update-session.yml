name: Update Account Session
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Update n0229 session
      env:
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS }}
      run: |
        python3 << 'PYEOF'
        import json, os, base64
        accounts = json.loads(os.environ['ANYROUTER_ACCOUNTS'])
        new_session = "_8BE_YS65-mWudJO53AufR-u3Q="
        new_api_user = "140359"
        found = False
        for acc in accounts:
            if acc.get('name') == 'n0229':
                if isinstance(acc['cookies'], dict):
                    acc['cookies']['session'] = new_session
                else:
                    acc['cookies'] = {'session': new_session}
                acc['api_user'] = new_api_user
                found = True
                break
        if not found:
            print('ERROR: n0229 not found')
            exit(1)
        result = json.dumps(accounts, ensure_ascii=False)
        with open('updated_accounts.json', 'w') as f:
            f.write(result)
        print(f'Updated n0229, total accounts: {len(accounts)}')
        PYEOF

    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: updated-accounts
        path: updated_accounts.json
        retention-days: 1
